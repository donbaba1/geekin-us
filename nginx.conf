server {
    listen 80;
    server_name localhost;

    # ── MIME types for .well-known files ─────────────────────────────────────
    types {
        application/linkset+json  api-catalog;
        application/json          json;
        text/plain                txt;
        text/xml                  xml;
    }

    # ── Contact form API (SMTP-backed) — see server/ ──────────────────────────
    # Proxies to the "api" service from docker-compose.yml. If you deploy the
    # API elsewhere, point this at its real address instead.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # React Router support
        try_files $uri $uri/ /index.html;

        # ── RFC 8288 Link headers for agent discovery ─────────────────────────
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"' always;
        add_header Link '</sitemap.xml>; rel="sitemap"; type="application/xml"' always;

        # ── Markdown for Agents (Cloudflare "text/markdown" content negotiation)
        # When a client sends Accept: text/markdown, respond with text/markdown.
        # Nginx cannot do server-side rendering, so we set the header to signal
        # support and let a Cloudflare Worker / upstream handle the conversion.
        # Remove the block below if you have no upstream markdown renderer.
        if ($http_accept ~* "text/markdown") {
            add_header Content-Type "text/markdown; charset=utf-8" always;
        }
    }

    # ── Serve robots.txt with correct MIME type ───────────────────────────────
    location = /robots.txt {
        root /usr/share/nginx/html;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Serve sitemap.xml ─────────────────────────────────────────────────────
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Serve .well-known/ files with correct MIME types ─────────────────────
    location /.well-known/ {
        root /usr/share/nginx/html;
        default_type application/json;

        # api-catalog must return application/linkset+json (RFC 9727)
        location = /.well-known/api-catalog {
            add_header Content-Type "application/linkset+json" always;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # MCP server card
        location = /.well-known/mcp/server-card.json {
            add_header Content-Type "application/json" always;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # Web Bot Auth JWKS directory
        location = /.well-known/http-message-signatures-directory {
            add_header Content-Type "application/json" always;
            add_header Cache-Control "public, max-age=3600" always;
        }
    }
}
